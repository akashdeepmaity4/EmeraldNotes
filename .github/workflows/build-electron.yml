name: Build Electron Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Package Application
      run: npm run dist
      env:
        # Prevents code-signing errors on Mac if you don't have a developer certificate yet
        CSC_IDENTITY_AUTODISCOVER: false 

    - name: Upload Desktop Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Electron-Release-${{ matrix.os }}
        path: dist/
