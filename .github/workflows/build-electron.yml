name: Build and Sign Electron App

on:
  push:
    branches: [ v2.0 ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Package Application
      run: npm run dist

    - name: Digitally Sign MSI Installer
      run: |
        powershell -File ./sign-msi.ps1 `
          -Base64Certificate "${{ secrets.SIGNING_CERT_BASE64 }}" `
          -CertificatePassword "${{ secrets.SIGNING_CERT_PASSWORD }}"
      shell: powershell

    - name: Upload Signed Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VeritasNotes-Windows-Signed
        path: dist/*.msi
