{% extends "base.html" %}

{% block title %}Emerald Notes - Dashboard{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h2>Your Projects</h2>
        <a href="{{ url_for('new_project') }}" class="create-btn">+ New Project</a>
    </div>

    <div class="project-grid">
        {% for project in projects %}
            <div class="project-card">
                <div class="project-info">
                    <h3>{{ project }}</h3>
                </div>
                <a href="{{ url_for('edit_project', filename=project) }}" class="open-btn">Open</a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
