{% extends "base.html" %}

{% block title %}Emerald Notes - Dashboard{% endblock %}

{% block content %}
<div class="projects-grid">
    <!-- New Project Card -->
    <a href="{{ url_for('new_project') }}" class="project-card new-card">
        <div class="card-icon">+</div>
        <div class="card-label">New</div>
    </a>

    <!-- Existing Projects Cards -->
    {% for file in projects %}
    <a href="{{ url_for('edit_project', filename=file) }}" class="project-card doc-card">
        <div class="card-preview">
            <span class="vertical-title">{{ file }}</span>
        </div>
        <div class="card-label">{{ file }}</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
