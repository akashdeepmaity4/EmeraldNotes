{% extends "base.html" %}

{% block title %}Emerald Notes - Dashboard{% endblock %}

{% block content %}
<div class="projects-grid">
    <a href="{{ url_for('new_project') }}" class="project-card new-card">
        <div class="card-icon">+</div>
        <div class="card-label">New</div>
    </a>

    {% for project in projects %}
    <a href="{{ url_for('edit_project', filename=project.filename) }}" class="project-card doc-card">
        <div class="card-preview">
            <span class="preview-text">{{ project.preview }}</span>
        </div>
        <div class="card-label">{{ project.filename }}</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
