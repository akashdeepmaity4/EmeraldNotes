<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Emerald Notes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <a href="{{ url_for('home') }}" class="brand-pill">Emerald Notes</a>

        <div class="nav-right">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>

            <div class="user-icon" id="profileLogo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                </svg>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="pathModal" class="path-modal-overlay" style="display: none;">
        <div class="path-modal">
            <h3>Storage Location</h3>
            <p class="sub-text">Tell the location of where you want your files to be stored</p>

            <div class="path-input-group">
                <input type="text" id="storagePathInput" placeholder="e.g. D:/projects/emeraldnotes/storage" />
            </div>

            <div class="path-actions">
                <button id="cancelPathBtn" class="cancel-btn">Cancel</button>
                <button id="savePathBtn" class="save-btn">✓ Save Path</button>
            </div>

            <div class="path-hint">
                <small>Current: <code id="currentPathDisplay"></code></small>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
